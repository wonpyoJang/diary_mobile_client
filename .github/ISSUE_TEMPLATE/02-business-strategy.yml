name: "비즈니스 전략"
description: "ICP, 포지셔닝, 수익·티어, B2B, 제휴, 지표, 의사결정 메모"
title: "[biz] "
labels:
  - role/business
body:
  - type: markdown
    attributes:
      value: |
        **비즈니스 직군**용 이슈입니다. 개발 백로그로 넘길 때는 `role/engineering` 이슈를 새로 열거나 이 이슈에 링크·체크리스트로 쪼개 주세요.  
        장기 전략 문서는 `.github/business-strategy-issue-body.md` / [이슈 #38](https://github.com/wonpyoJang/diary_mobile_client/issues/38)과 연동할 수 있습니다.
  - type: textarea
    id: goal
    attributes:
      label: 목표 / 질문
      description: 결정하거나 정리하고 싶은 것
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 옵션·가정
      description: 후보, 트레이드오프, 가정 (번호 목록 권장)
    validations:
      required: false
  - type: textarea
    id: eng_need
    attributes:
      label: 개발·제품에 필요한 입력
      description: 구현/검증에 필요한 수치, 정책, 데드라인
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: 연관 이슈
      description: 전략·그로스·기능 이슈 링크
    validations:
      required: false
