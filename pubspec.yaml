name: diary_mobile_client
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.2.3+21

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management libraries
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0

  # Utility libraries
  equatable: ^2.0.0
  get_it: ^8.2.0
  injectable: ^2.5.1
  rxdart: ^0.28.0
  flutter_slidable: ^4.0.0
  uuid: ^4.3.3  # ID 생성을 위한 패키지
  crypto: ^3.0.6
  firebase_ai: ^2.2.1
  google_fonts: ^6.2.1
  sentry_flutter: ^8.12.0
  mesh_gradient: ^1.3.8
  mesh: ^0.4.2
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^4.0.1
  html: ^0.15.5
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  share_plus: ^10.0.0
  flutter_gen: ^5.9.0
  table_calendar: ^3.1.3
  fpdart: ^1.1.1
  logger: ^2.5.0
  dio: ^5.8.0+1
  intl: any
  package_info_plus: ^8.2.0
  local_auth: ^2.3.0
  
  firebase_core: ^3.13.0 
  firebase_analytics: 
  firebase_crashlytics: 
  flutter_dotenv: ^5.2.1
  firebase_app_installations: ^0.3.2+5
  flutter_svg: ^2.0.17
  loading_indicator: ^3.1.1
  pull_down_button: ^0.10.2
  device_info_plus: ^11.4.0
  image_picker: ^1.1.2
  image: ^4.5.4
  photo_view: ^0.14.0
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.9.1
  app_links: ^3.4.5
  webview_flutter: ^4.7.0
  uni_links: ^0.5.1
  firebase_remote_config: ^5.4.7
  flutter_gemma: ^0.11.16

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  injectable_generator: ^2.5.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  drift_dev: ^2.28.1
  build_runner: ^2.6.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/images/feature/moment/write_moment/
    - assets/images/feature/moment/moment_calendar/
    - assets/images/common/background/
    - assets/images/common/
    - .env
  fonts:
    - family: SpoqaHanSansNeo
      fonts:
        - asset: assets/fonts/SpoqaHanSansNeo-Bold.ttf
          weight: 700
        - asset: assets/fonts/SpoqaHanSansNeo-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpoqaHanSansNeo-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpoqaHanSansNeo-Light.ttf
          weight: 300
        - asset: assets/fonts/SpoqaHanSansNeo-Thin.ttf
          weight: 100

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" # 앱 아이콘 경로 설정
  adaptive_icon_background: "#ffffff" # 안드로이드 어댑티브 아이콘 배경색
  adaptive_icon_foreground: "assets/logo.png" # 안드로이드 어댑티브 아이콘 전경 이미지
  remove_alpha_ios: true
